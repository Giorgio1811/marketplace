{% extends "loja/base.html" %}
{% block titulo %}Catálogo | Marketplace{% endblock %}
{% block conteudo %}
<section class="hero glass-panel">
    <div>
        <span class="eyebrow">Sua próxima compra</span>
        <h1>Catálogo</h1>
    </div>
    <div class="stat-pill">
        <strong id="contador-carrinho-hero">0</strong>
        <span>itens no carrinho</span>
    </div>
</section>

<section class="glass-panel filter-panel">
    <form id="filtros" class="filters-grid">
        <input class="field" name="busca" placeholder="Buscar por nome">
        <input class="field" name="preco_minimo" type="number" step="0.01" min="0" placeholder="Preço mínimo">
        <input class="field" name="preco_maximo" type="number" step="0.01" min="0" placeholder="Preço máximo">
        <label class="checkbox-wrap">
            <input name="disponivel" type="checkbox" value="true">
            <span>Somente disponíveis</span>
        </label>
        <button class="primary" type="submit">Filtrar</button>
    </form>
</section>

<p id="status" class="results-summary">Carregando produtos...</p>
<section id="grade" class="grade"></section>
<script>
function getCookie(name) {
    return document.cookie.split("; ").find(row => row.startsWith(name + "="))?.split("=")[1];
}
const contador = document.getElementById("contador-carrinho");
const contadorHero = document.getElementById("contador-carrinho-hero");
const syncCartCount = (value) => {
    const quantidade = value || "0";
    contador.textContent = quantidade;
    if (contadorHero) contadorHero.textContent = quantidade;
    localStorage.setItem("contador-carrinho", quantidade);
};
syncCartCount(localStorage.getItem("contador-carrinho") || "0");
function carregarCatalogo() {
const parametros = new URLSearchParams(new FormData(document.getElementById("filtros")));
fetch("/api/produtos/?" + parametros)
    .then(response => { if (!response.ok) throw new Error("Falha na API"); return response.json(); })
    .then(produtos => {
        document.getElementById("status").textContent = produtos.length + " produto(s) encontrado(s).";
        const grade = document.getElementById("grade");
        grade.innerHTML = "";
        produtos.forEach(produto => {
            const card = document.createElement("article");
            card.className = "card";
            card.innerHTML = `<h2></h2><small></small><p class="preco"></p><button type="button"></button>`;
            card.querySelector("h2").textContent = produto.nome;
            card.querySelector("small").textContent = produto.categoria_nome;
            card.querySelector(".preco").textContent = "R$ " + produto.preco;
            const button = card.querySelector("button");
            button.textContent = produto.estoque > 0 ? "Adicionar ao carrinho" : "Sem estoque";
            button.disabled = produto.estoque <= 0;
            button.onclick = () => fetch(`/carrinho/adicionar/${produto.id}/`, {
                method: "POST",
                headers: {
                    "X-CSRFToken": decodeURIComponent(getCookie("csrftoken") || ""),
                    "X-Requested-With": "fetch"
                }
            }).then(response => {
                if (!response.ok) throw new Error("Não foi possível adicionar");
                return response.json();
            }).then(data => {
                syncCartCount(data.itens);
            });
            grade.appendChild(card);
        });
    })
    .catch(error => { document.getElementById("status").textContent = "Não foi possível carregar o catálogo."; console.error(error); });
}
document.getElementById("filtros").onsubmit = event => { event.preventDefault(); document.getElementById("grade").replaceChildren(); carregarCatalogo(); };
carregarCatalogo();
</script>
{% endblock %}
